---
name: Create Specification Document

# Builds the ARC-compliant submission PDF (and the HTML render) for this
# specification. Version and phase identity come from scripts/release-info.sh,
# which is the single source of truth shared with the Antora site stamp that
# lands later in the migration (see MIGRATION.md Step 12).
on:
  # Preview only: builds the PDF and HTML for the current ref and publishes
  # nothing.
  workflow_dispatch:

  pull_request:
  push:
    branches:
      - main
    # A pushed v* tag builds and releases that version.
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set_build_version.outputs.version }}
      date: ${{ steps.set_build_version.outputs.date }}
      releasable: ${{ steps.classify.outputs.releasable }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # release-info.sh resolves the version from the tag list, so the full
          # history is required -- a shallow clone has no tags to read.
          fetch-depth: 0
          submodules: recursive

      - name: Pull Container
        run: docker pull ghcr.io/riscv/riscv-docs-base-container-image:latest

      # Set VERSION and DATE for this build.
      #
      # A RELEASE build is a pushed tag. It names an existing tag, so DATE comes
      # from the TAGGED COMMIT rather than "today": rebuilding a tag then
      # reproduces an identical PDF filename instead of churning a new one.
      #
      # Everything else is a DEVELOPMENT build (pull request, push to main,
      # preview dispatch) and resolves to <latest-tag>-<sha> via release-info.sh
      # -- byte-for-byte what a local `make` produces. Development builds must
      # NOT compute `next`: a preview stamped with the next release number spends
      # a version that has not been cut, so the eventual real release would ship
      # a second, different document under the same name.
      - name: Set build version
        id: set_build_version
        run: |
          set -euo pipefail

          date=""
          tag=""

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="$(./scripts/release-info.sh normalize "${{ github.ref_name }}")"
          fi

          if [ -n "$tag" ]; then
            version="$tag"
            release_build=true
            if ! date="$(git log -1 --format=%cs "$tag" 2>/dev/null)"; then
              echo "::error::$tag is not a tag in this repository; a release build must name an existing tag."
              exit 1
            fi
          else
            version="$(./scripts/release-info.sh version)"
            # NOT derivable from the version string: release-info.sh returns a
            # bare vX.YY (no -<sha>) whenever HEAD happens to carry a tag, so a
            # push to main landing on a freshly tagged commit would otherwise
            # look releasable and re-cut that release.
            release_build=false
          fi

          # Resolve the date ONCE so every consumer shares it exactly (no
          # midnight-boundary drift between separate steps).
          date="${date:-$(date +%Y-%m-%d)}"

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DATE=$date" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD=$release_build" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Classify release type
        id: classify
        run: |
          set -euo pipefail

          # Two independent conditions, both required:
          #   RELEASE_BUILD  this run was asked for a specific tag
          #   no -<sha>      the resolved version is not a development version
          #
          # The second alone is not enough (a preview can land on a tagged commit
          # and resolve to a bare version); the first alone is not enough either
          # (it is the last line of defence against ever releasing a -<sha>
          # version).
          if [ "$RELEASE_BUILD" = "true" ] && [ "${VERSION#*-}" = "${VERSION}" ]; then
            releasable=true
          else
            releasable=false
            echo "$VERSION is a development build; this run publishes nothing."
          fi
          echo "RELEASABLE=$releasable" >> "$GITHUB_ENV"
          echo "releasable=$releasable" >> "$GITHUB_OUTPUT"

          # Milestone-gate tags (v0.6, v0.8, v0.9, v0.99, v1.0) get a
          # non-prerelease GitHub Release. release-info.sh is the single source
          # of truth for which versions are milestones.
          if ./scripts/release-info.sh is-milestone "${VERSION}"; then
            echo "OFFICIAL_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "OFFICIAL_RELEASE=false" >> "$GITHUB_ENV"
          fi

      # VERSION and DATE are exported so the Makefile produces the ARC-compliant
      # PDF name: <spec_short>-v<ver>-<YYYYMMDD>.pdf
      - name: Build Files
        run: |
          set -euo pipefail
          export VERSION="${VERSION}"
          export DATE="${DATE}"
          echo "Building ${VERSION} (${DATE})"
          make

      # The HTML is rendered on every run whether or not we keep it -- build-docs
      # depends on $(DOCS_HTML) as well as $(DOCS_PDF) -- so retaining it costs no
      # extra build time, and reviewers get the rendered document instead of only
      # the PDF. It travels as one file: the spec sets :data-uri:, so images and
      # the stylesheet are inlined and nothing sidecar has to ship with it.
      - name: Upload Build Artifacts
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: Build Artifacts
          path: |
            ${{ github.workspace }}/build/*.pdf
            ${{ github.workspace }}/build/*.html
          retention-days: 30

      # Put a direct link in the run summary, so reaching the build output is one
      # click from the Checks tab. Needs no permissions and works on fork PRs,
      # unlike a PR comment.
      - name: Link the build artifacts in the run summary
        if: steps.upload.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo "### Built document"
            echo
            echo "[Download the build artifacts]($ARTIFACT_URL) — \`${VERSION}\` (${DATE})."
            echo
            echo "- Downloading requires being signed in to GitHub (an Actions limitation)."
            echo "- Retained for 30 days."
          } >> "$GITHUB_STEP_SUMMARY"

      # RELEASABLE, not the event name, decides whether a release happens at all.
      - name: Create Release (Official)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/build/*.pdf
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
        if: env.RELEASABLE == 'true' && env.OFFICIAL_RELEASE == 'true'

      - name: Create Release (Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/build/*.pdf
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
        if: env.RELEASABLE == 'true' && env.OFFICIAL_RELEASE != 'true'

  # Keep the Antora HTML site version in EXACT lockstep with the PDF this run just
  # built: stamp the SAME resolved version/date into antora.yml on main, so the
  # published site carries the version the PDF carries. The PDF and this stamp come
  # from one build job (same source, same VERSION/DATE) -- they cannot drift.
  #
  # Runs only for real releases, never PR previews. Never moves main's version
  # backwards, so rebuilding an older tag will not regress the site.
  #
  # The stamp lands as a REVIEW PR, not a direct push to `main`: a rejected push
  # under branch protection would leave the release green while the site version
  # silently lagged the PDF -- the exact divergence this job exists to prevent.
  # Merging that PR is part of cutting a release (see MIGRATION.md Step 14).
  stamp-site-version:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.releasable == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
          # Do not persist the token as a git extraheader. create-pull-request
          # injects its own auth header; a persisted one here makes git send two
          # Authorization headers -> GitHub 400 "Duplicate header: Authorization".
          persist-credentials: false

      - name: Stamp antora.yml to match the released PDF version
        id: stamp
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DATE: ${{ needs.build.outputs.date }}
        run: |
          set -euo pipefail

          current="$(grep -E '^version:' antora.yml | awk '{print $2}')"
          echo "main antora.yml version: ${current:-<none>}; released version: $VERSION"

          # Monotonic guard: never stamp main backwards (e.g. when an old tag is
          # rebuilt). Compare by DECIMAL order via release-info.sh -- `sort -V`
          # would rank v0.8 below v0.61 and stamp the site backwards.
          #
          # Skip at >=, not just at >. At an EQUAL version the only field that can
          # still differ is page-revdate, and a PR that moves a released version's
          # date forward is pure churn that also misdates the release.
          if [ -n "$current" ] && [ "$current" != "~" ]; then
            if [ "$(./scripts/release-info.sh compare "$current" "$VERSION")" != "-1" ]; then
              echo "main is already at $current (>= $VERSION); skipping stamp."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Leaves antora.yml modified in the worktree; create-pull-request below
          # is what commits it. stamp-antora fails loudly if it cannot stamp, so a
          # no-op here means "already correct", never "silently did nothing".
          make stamp-antora VERSION="$VERSION" DATE="$DATE"

          if git diff --quiet -- antora.yml; then
            echo "antora.yml already matches $VERSION; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open site version stamp PR
        if: steps.stamp.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GHTOKEN || secrets.GITHUB_TOKEN }}
          base: main
          commit-message: 'chore(site): stamp Antora version ${{ needs.build.outputs.version }} to match PDF'
          branch: gitbot/stamp-site-${{ needs.build.outputs.version }}
          delete-branch: true
          title: Stamp Antora site version ${{ needs.build.outputs.version }} to match released PDF
          body: |
            This PR was opened automatically by the `${{ needs.build.outputs.version }}` release build.

            The ARC Author Guide requires the published HTML site version to match
            the submission PDF exactly. Antora reads a static `version:` from the
            committed `antora.yml`, so a release has to stamp that file.

            Released PDF version: `${{ needs.build.outputs.version }}` (${{ needs.build.outputs.date }})

            **Until this merges, the site version lags the released PDF.** The
            values come from `scripts/release-info.sh` -- the same source the PDF
            build uses -- so this needs a merge, not an edit.
          labels: |
            site-version
            automated
          add-paths: |
            antora.yml
